name: Testes Sistema Escola
on:
  push:
    branches: [master, 'melhorias/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe JS
        run: |
          node --check app.js
          node --check database/config/config.js
          node --check test/config.test.js
      - name: Testes da configuração
        run: npm test
